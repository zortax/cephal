<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    The intrinsic width of a row flex container counts an item of `width: max-content` at its
    max-content width, and a scroll container item at its preferred width rather than its flex
    base size
  </title>
</head>
<body>

<div id="test-root" style="display: block; width: 64px;">
  <div style="display: flex; width: fit-content;">
    <div style="display: block; width: max-content;">X&#8203;X&#8203;X&#8203;X&#8203;X&#8203;X&#8203;X</div>
  </div>
  <div style="display: flex; width: min-content;">
    <div style="display: block;"></div>
    <div style="display: block; width: 144px; overflow: hidden; flex-grow: 2; flex-basis: 87%;">X&#8203;X&#8203;X</div>
  </div>
</div>

</body>
</html>
