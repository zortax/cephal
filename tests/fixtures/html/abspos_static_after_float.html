<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    The static position of an absolutely positioned box after a float, hoisted out of a static block
  </title>
</head>
<body>

<div id="test-root" style="display: block; width: 200px; padding: 8px;">
  <div style="display: block; position: static; padding: 4px;">
    <div style="float: left; width: 50px; height: 30px;"></div>
    <div style="position: absolute; width: 20px; height: 20px;"></div>
    <div style="display: block; height: 10px;"></div>
  </div>
</div>

</body>
</html>
