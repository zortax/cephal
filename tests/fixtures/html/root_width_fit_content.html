<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A block root of `width: fit-content` shrinks to its content instead of filling the viewport
  </title>
</head>
<body>

<div class="viewport" style="display: block; width: 300px; height: 200px;">
  <div id="test-root" style="display: block; width: fit-content; padding: 5px;">
    <div style="display: block; width: 50px; height: 10px;"></div>
    <div style="display: block; width: 30px; height: 10px;"></div>
  </div>
</div>

</body>
</html>
