<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A block root of `height: stretch` fills a definite viewport height less its margins
  </title>
</head>
<body>

<div class="viewport" style="display: block; width: 300px; height: 200px;">
  <div id="test-root" style="display: block; height: stretch; margin-top: 20px; padding: 5px;">
    <div style="display: block; height: 50%;"></div>
  </div>
</div>

</body>
</html>
