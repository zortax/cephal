<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A percentage row gap of a column flex container of indefinite height is zero, also once the
    height is found; a percentage column gap of a row container resolves against the width found
  </title>
</head>
<body>

<div id="test-root" style="display: block; width: 300px;">
  <div style="display: flex; flex-direction: column; row-gap: 10%;">
    <div style="display: block; height: 20px;"></div>
    <div style="display: block; height: 20px;"></div>
  </div>
  <div style="display: flex; flex-direction: column; row-gap: 10%; column-gap: 10%; flex-wrap: wrap; height: 30px; width: max-content;">
    <div style="display: block; height: 20px; width: 20px;"></div>
    <div style="display: block; height: 20px; width: 20px;"></div>
  </div>
</div>

</body>
</html>
