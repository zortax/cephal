<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    `align-content` in a block container keeps content that overflows at the start, unless the
    alignment says `unsafe`; content that fits is aligned
  </title>
</head>
<body>

<div id="test-root" style="display: block; width: 300px;">
  <div style="display: block; height: 20px; align-content: center;">
    <div style="display: block; height: 40px;"></div>
  </div>
  <div style="display: block; height: 20px; align-content: end;">
    <div style="display: block; height: 40px;"></div>
  </div>
  <div style="display: block; height: 20px; align-content: unsafe center;">
    <div style="display: block; height: 40px;"></div>
  </div>
  <div style="display: block; height: 60px; align-content: center;">
    <div style="display: block; height: 40px;"></div>
  </div>
</div>

</body>
</html>
