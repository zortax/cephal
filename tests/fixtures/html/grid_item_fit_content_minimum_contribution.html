<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A grid item of `width: fit-content` has the minimum contribution of an `auto` width (as
    Chrome): none across a flexible track, and its content clamped by a fixed maximum track size;
    `min-content` contributes its min-content size
  </title>
</head>
<body>

<div id="test-root" style="display: block; width: 128px;">
  <div style="display: grid; grid-template-columns: 3fr 46% auto;">
    <div style="display: block; width: fit-content; grid-column-start: span 2;">
      <div style="display: block; width: 194px; height: 5px;"></div>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: minmax(auto, 20px) 30px;">
    <div style="display: block; width: fit-content;">
      <div style="display: block; width: 194px; height: 5px;"></div>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: minmax(auto, 20px) 30px;">
    <div style="display: block; width: min-content;">
      <div style="display: block; width: 50px; height: 5px;"></div>
    </div>
  </div>
</div>

</body>
</html>
