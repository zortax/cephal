<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A block formatting context root grows to contain a float inside an in-flow child; its bottom
    padding and border come after the float (CSS 2.2 §10.6.7)
  </title>
</head>
<body>

<div id="test-root" style="display: flow-root; width: 200px; padding: 8px 8px 12px 8px; border-width: 1px 2px 3px 4px;">
  <div style="display: block; padding: 4px;">
    <div style="float: left; width: 50px; height: 30px; margin-bottom: 5px;"></div>
    <div style="display: block; height: 10px;"></div>
  </div>
</div>

</body>
</html>
