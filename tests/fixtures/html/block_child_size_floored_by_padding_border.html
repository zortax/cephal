<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A block container's flex and grid children are never smaller than their padding and border,
    also where a max size clamps their width or height below them
  </title>
</head>
<body>

<div id="test-root" style="display: block; width: 362px;">
  <div style="display: flex; max-width: 1px; padding-right: 7%;">
    <div style="display: block;"></div>
  </div>
  <div style="display: flex; height: 66px; max-height: 0px; padding-bottom: 8px; flex-direction: column;">
    <div style="display: block;"></div>
  </div>
  <div style="display: grid; max-width: 2px; border-left: 6px solid;">
    <div style="display: block; height: 5px;"></div>
  </div>
</div>

</body>
</html>
