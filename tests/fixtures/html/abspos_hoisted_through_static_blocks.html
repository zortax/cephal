<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    Absolutely positioned boxes hoisted through two static blocks to a relative root: auto insets give the static position, set insets resolve against the root's padding box
  </title>
</head>
<body>

<div id="test-root" style="display: block; width: 300px; height: 200px; padding: 10px 12px 14px 16px; border-width: 2px 3px 4px 5px;">
  <div style="display: block; position: static; padding: 7px; margin-left: 5px;">
    <div style="display: block; position: static; padding: 3px;">
      <div style="width: 20px; height: 15px;"></div>
      <div style="position: absolute; width: 30px; height: 10px;"></div>
      <div style="position: absolute; right: 4px; bottom: 6px; width: 25px; height: 12px;"></div>
      <div style="height: 9px;"></div>
    </div>
  </div>
</div>

</body>
</html>
