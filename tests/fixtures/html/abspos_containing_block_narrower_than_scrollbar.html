<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A containing block narrower than its scrollbar gives its absolutely positioned boxes no room,
    not negative room: a percentage inset resolves against zero and the box sits at its start
  </title>
</head>
<body>

<div id="test-root" style="display: block; width: 13px;">
  <div style="display: block; position: relative; overflow-x: hidden; overflow-y: scroll;">
    <div style="display: block; position: absolute; right: 4%;"></div>
    <div style="display: block; position: absolute; left: 50%; width: 3px; height: 3px;"></div>
  </div>
</div>

</body>
</html>
