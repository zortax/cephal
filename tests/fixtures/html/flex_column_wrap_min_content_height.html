<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    The min-content height of a multi-line column flex container of indefinite height is its
    max-content height: its items stay on one line (here in a `min-content` grid row)
  </title>
</head>
<body>

<div id="test-root" style="display: grid; width: 300px; grid-auto-rows: min-content;">
  <div style="display: flex; flex-direction: column; flex-wrap: wrap-reverse;">
    <div style="display: block;">X</div>
    <div style="display: block;">X</div>
  </div>
</div>

</body>
</html>
